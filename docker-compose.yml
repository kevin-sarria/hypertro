services:
  mysql:
    image: mysql:8.0
    container_name: hypertro-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hypertro_root
      MYSQL_DATABASE: hypertro
    volumes:
      - hypertro_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-phypertro_root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hypertro_mysql_data:
